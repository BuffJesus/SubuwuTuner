[[safety_pair]]
id        = "boost_without_wastegate"
title     = "Raises boost target without touching wastegate duty"
severity  = "high"
lhs_patterns = ["Boost Target Main", "Boost Limit Base", "Boost Limit Adder"]
rhs_patterns = ["Wastegate Duty Initial", "Wastegate Duty Maximum", "Wastegate PWM Duty Time", "Wastegate Barometric"]
rationale = "Boost target/limit raised without adjusting wastegate duty — ECU will demand boost the actuator cannot reliably deliver (or, conversely, the existing duty schedule will overshoot the new target)."

[[safety_pair]]
id        = "wastegate_without_pi"
title     = "Changes wastegate duty without touching PI control"
severity  = "low"
lhs_patterns = ["Wastegate Duty Initial", "Wastegate Duty Maximum"]
rhs_patterns = ["PI Control", "Boost Target Main"]
rationale = "Wastegate duty schedule edited but neither the boost target nor the PI correction loop was touched — feed-forward and closed-loop are now out of sync."

[[safety_pair]]
id        = "ignition_without_knock_or_lean"
title     = "Adds timing advance without raising knock thresholds or lean-limit adjustment"
severity  = "high"
lhs_patterns = ["Ignition - Dynamic Advance - Adder", "Ignition - Dynamic Advance - Base", "Ignition - Primary"]
rhs_patterns = ["Knock Threshold", "Lean Limit", "DAM Initial"]
rationale = "More commanded timing without raising the knock-detection threshold or richening the fuel target means the ECU is more likely to false-detect knock OR to actually knock with no fuel-side safety margin."

[[safety_pair]]
id        = "maf_without_fuel"
title     = "Increases max airflow / MAF scale without fuel-injector or SOI compensation"
severity  = "high"
lhs_patterns = ["MAF Volumetric Efficiency Correction", "Airflow - Idle - Mass Airflow Minimum"]
rhs_patterns = ["Fuel - Injectors", "Injector Mult", "Start of Injection", "Fuel - Closed Loop - Base Offset"]
rationale = "Airflow model rescaled without adjusting injector pulse or SOI tables — calculated fuel mass diverges from delivered fuel mass; AFR will drift."

[[safety_pair]]
id        = "torque_limit_without_requested_torque"
title     = "Reduces / changes torque limits without adjusting requested-torque map"
severity  = "med"
lhs_patterns = ["Requested Torque DAM Limit", "Requested Torque IAT Limit", "Requested Torque Per Gear Limit", "Throttle - Requested Torque - Limits"]
rhs_patterns = ["Throttle - Requested Torque  - Requested Torque", "Throttle - Requested Torque - Group 2"]
rationale = "Limit/clamp tables edited but the underlying requested-torque schedule untouched — driver demand vs. allowed torque will produce dead zones or sudden cuts."

[[safety_pair]]
id        = "boost_target_without_requested_torque"
title     = "Raises boost target without re-mapping requested-torque"
severity  = "med"
lhs_patterns = ["Boost Target Main", "Boost Limit Base"]
rhs_patterns = ["Requested Torque", "Target Throttle"]
rationale = "On torque-based ECUs, raising boost without remapping requested-torque can cause the throttle to close to honor the original torque ceiling — boost target met, but driver feel is wrong."

[[safety_pair]]
id        = "hpfp_limit_without_base"
title     = "Changes HPFP Valve Close Limit without touching Valve Close Base"
severity  = "med"
lhs_patterns = ["HPFP - Valve Close Limit"]
rhs_patterns = ["HPFP - Valve Close Base", "HPFP - Valve Open Base"]
rationale = "Adjusting the HPFP limit envelope without re-scheduling the base phase command leaves the operating point pressed against the new clamp — fuel pressure will track the limit rather than the target."

[[safety_pair]]
id        = "avcs_intake_without_exhaust"
title     = "Re-targets intake AVCS without re-targeting exhaust AVCS"
severity  = "low"
lhs_patterns = ["AVCS - Intake - Target", "AVCS - Intake - .* - Intake Cam Target"]
rhs_patterns = ["AVCS - Exhaust"]
rationale = "Intake cam retargeted but exhaust cam left at stock — overlap profile shifts in a way the rest of the cal wasn't optimised for. Low severity: not unsafe, just asymmetric."

