# Example custom-feature hooks per docs/16-custom-features.md. These are
# illustrative — the addresses and RAM regions are NOT real ECU values,
# they're placeholders so the designer-canvas hook palette can be
# exercised end-to-end against this synthetic pack. Real packs supply
# addresses derived from each ECU's firmware analysis.
#
# Direction convention per docs/16: a hook's `inputs` block lists the
# values the hook PROVIDES to the user's logic (these become graph
# Output pins on the node); the `outputs` block lists values the user
# must SUPPLY back (graph Input pins). A pure sensor read therefore
# uses only `inputs`; a pure action splice (e.g. ignition_cut) uses
# only `outputs`; a value-override splice uses both.
#
# `name` is the canonical id (snake_case, what codegen will eventually
# emit). `label` is what the editor shows the user — keep it short and
# in tuning vocabulary.

# ---- Splice points -------------------------------------------------

[[hook]]
id           = "after_fuel_calc"
display_name = "After fuel calc"
description  = "After the ECU has computed commanded injector pulse width"
ecu_address  = 0x000ABCD0
free_ram     = { base = 0x40000000, length = 256 }
inputs = [
  { name = "rpm",          label = "Engine RPM",       type = "float", unit = "rpm" },
  { name = "load",         label = "Engine load",      type = "float", unit = "%"   },
  { name = "commanded_pw", label = "Commanded fuel PW", type = "float", unit = "ms"  },
  { name = "coolant_temp", label = "Coolant temp",     type = "float", unit = "°C"  },
]
outputs = [
  { name = "commanded_pw_override", label = "Override fuel PW", type = "float", unit = "ms" },
]

[[hook]]
id           = "ignition_cut"
display_name = "Ignition cut"
description  = "Suppress ignition events while the input is true (e.g. for flat-foot shifting)"
ecu_address  = 0x000ABE00
free_ram     = { base = 0x40000100, length = 64 }
outputs = [
  { name = "cut_active", label = "Cut active", type = "bool" },
]

[[hook]]
id           = "set_active_map"
display_name = "Select active map"
description  = "Override the calibration's active-map selector (multi-map ECUs choose between maps 0..N-1; this hook routes a user-computed Int selector). Synthetic demo target — exercises the SH-2A Int store path."
ecu_address  = 0x000ABE40
free_ram     = { base = 0x40000180, length = 64 }
outputs = [
  { name = "map_index", label = "Map index", type = "int" },
]

[[hook]]
id           = "override_vvt_target"
display_name = "Override VVT target angle"
description  = """
Splice point after the ECU computes its commanded intake/exhaust VVT target
angles, before the value is dispatched to the cam-phaser control loop.

Generic VVT-override hook — supports any case where user code needs to
inject a corrected cam target between the ECU's VE/spark/AFR models and
the AVCS actuator. NOT the FA20→FA24 swap fix (that's a cam-trigger-wheel
hardware change plus VE table edits, per docs/16); kept here as a useful
primitive for other projects (cam-swap recipes, custom VVT scheduling on
race engines, anti-knock VVT retard overrides).

Pack-specific notes: address + RAM region are placeholders in this demo
pack; a real VA-WRX pack supplies the actual firmware splice address (the
instruction where the cam-target word is written to the VVT control
register) plus a writable free-RAM region for the patch's working storage.
"""
ecu_address  = 0x000ABE80
free_ram     = { base = 0x40000200, length = 128 }
inputs = [
  { name = "commanded_intake_deg",  label = "Commanded intake VVT",  type = "float", unit = "deg", address = 0x000F2100 },
  { name = "commanded_exhaust_deg", label = "Commanded exhaust VVT", type = "float", unit = "deg", address = 0x000F2104 },
  { name = "rpm",                   label = "Engine RPM",            type = "float", unit = "rpm", address = 0x000F2000 },
  { name = "coolant_temp",          label = "Coolant temp",          type = "float", unit = "°C",  address = 0x000F2108 },
]
outputs = [
  { name = "intake_override_deg",  label = "Override intake VVT",  type = "float", unit = "deg" },
  { name = "exhaust_override_deg", label = "Override exhaust VVT", type = "float", unit = "deg" },
]

[[hook]]
id           = "override_hpfp_target"
display_name = "Override HPFP target pressure"
description  = """
Splice point after the ECU computes its commanded HPFP rail pressure
target, before the value is dispatched to the pump-control PID.

Primary use case (docs/16 §"Motivating use cases"): integrating a
CAN-bus aftermarket fuel pressure sensor into the FA20 ECU's HPFP
control loop on an FA20→FA24 swap. The OEM ECU has no slot for a
secondary fuel pressure sensor's signal; a custom feature ingests
the aftermarket reading and clamps the commanded target to a value
the FA24 pump can actually reach at the current RPM. Pairs with a
CAN-RX node for the aftermarket sensor.

NOTE: the simpler fix for the same swap is just to make the HPFP duty
+ target pressure tables editable in the definition pack (see docs/16
§"Worked example"). Use this hook when you need RUNTIME behavior the
tables can't express — e.g. dynamic clamping based on a real-time
3rd-party pressure reading.

Pack-specific notes: address + RAM region are placeholders here; real
VA-WRX packs supply the firmware splice address and writable RAM.
"""
ecu_address  = 0x000ABF00
free_ram     = { base = 0x40000280, length = 128 }
inputs = [
  { name = "commanded_pressure_bar", label = "Commanded rail pressure", type = "float", unit = "bar", address = 0x000F2200 },
  { name = "actual_pressure_bar",    label = "Actual rail pressure",    type = "float", unit = "bar", address = 0x000F2204 },
  { name = "rpm",                    label = "Engine RPM",              type = "float", unit = "rpm", address = 0x000F2000 },
  { name = "load",                   label = "Engine load",             type = "float", unit = "%",   address = 0x000F2208 },
]
outputs = [
  { name = "target_override_bar", label = "Override target pressure", type = "float", unit = "bar" },
]

