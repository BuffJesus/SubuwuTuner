[[hook]]
id           = "override_injector_pw"
display_name = "Override injector pulse-width"
description  = """
Splice point after the ECU computes its commanded injector pulse-width
(per cycle, per cylinder), before the value is dispatched to the
injector driver hardware.

The canonical surface for Bernoulli-based differential-fuel-pressure
compensation. When the actual rail pressure deviates from the
commanded pressure (e.g. FA24 stock HPFP can't reach the FA20 ECU's
target), the per-cycle fuel delivered by a fixed-duration pulse is
off by sqrt(actual_dp / expected_dp). Compensating on the PW side —
lengthening the pulse so total fuel mass matches the ECU's intent —
preserves AFR closed-loop behavior; compensating on the HPFP target
side just fights the OEM PID. COBB's "Subaru Differential Fuel
Pressure Compensation" is this same shape.

Pairs with `read_aux_fuel_pressure` (for the actual rail pressure
signal) and the SH-2A `sqrt_float` primitive (for the Bernoulli
correction). See fixtures/samples/fa24-bernoulli-comp.stmod for the
worked sample.

Pack-specific notes: address + RAM region are placeholders. A real
VA-WRX pack supplies the firmware splice address (the instruction
where the per-cycle PW is written to the injector control register
or the inter-cylinder PW queue) plus a writable free-RAM region.
"""
ecu_address  = 0x000ABF80
free_ram     = { base = 0x40000300, length = 128 }
inputs = [
  { name = "commanded_pw_ms",        label = "Commanded injector PW",  type = "float", unit = "ms",  address = 0x000F2300 },
  { name = "rpm",                    label = "Engine RPM",             type = "float", unit = "rpm", address = 0x000F2000 },
  { name = "load",                   label = "Engine load",            type = "float", unit = "%",   address = 0x000F2208 },
  { name = "manifold_pressure_bar",  label = "Manifold abs pressure",  type = "float", unit = "bar", address = 0x000F2304 },
  { name = "commanded_pressure_bar", label = "Commanded rail pressure", type = "float", unit = "bar", address = 0x000F2200 },
]
outputs = [
  { name = "pw_override_ms", label = "Override injector PW", type = "float", unit = "ms" },
]

[[hook]]
id           = "read_aux_fuel_pressure"
display_name = "Aux fuel pressure (3rd-party CAN sensor)"
description  = """
Read an aftermarket fuel pressure sensor value that an aftermarket CAN
bus has deposited into a known firmware RAM address.

This is the SubuwuTuner equivalent of Atlas's "3rd-party sensor
integration" and COBB's "Differential Fuel Pressure Compensation"
pattern: the OEM ECU has no native slot for an aux sensor, so the
user wires the sensor onto a CAN bus, configures the ECU's existing
CAN driver (via separate pack metadata — out of this hook's scope)
to deposit incoming bytes at a fixed RAM address, and then user code
reads that address as if it were a sensor input.

Used in the fa24-aux-pressure-clamp.stmod sample to clamp the FA20
ECU's commanded HPFP target dynamically when the FA24's smaller
pump can't sustain the requested pressure.

The `aux_pressure_bar` input's `address` is a placeholder — a real
VA-WRX pack configured for an aftermarket sensor would point at the
exact RAM word where the CAN driver writes the decoded value.
"""
ecu_address  = 0x000AB220
inputs = [
  { name = "aux_pressure_bar", label = "Aux rail pressure", type = "float", unit = "bar", address = 0x000F2050 },
]
