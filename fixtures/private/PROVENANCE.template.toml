# PROVENANCE log for fixtures/private/ — local-only.
#
# Copy this file to `PROVENANCE.toml` (gitignored) and add one
# `[[rom]]` block per ROM you stage here. Provenance is what
# turns "some bytes on disk" into "a citable reference"
# (docs/15-clean-room-engineering.md §11).
#
# Discipline rule: never trust a numeric fact derived from a
# single source. Two independent observations beats one.

[[rom]]
file        = "AS80U_aw0123_stock.bin"
sha256      = "REPLACE_WITH_SHA256_OF_THE_FILE"
size_bytes  = 1572864                              # 1.5 MiB, typical VA
cid         = "AS80U   "                           # 8 chars, trailing spaces real
ecuid       = "401A344206"                          # 5-byte SSM init response
source      = "https://www.example.com/forum/thread/...  retrieved 2026-05-15"
source_kind = "community_dump"                     # community_dump | bench_capture | other
notes       = """
First sample to verify defgen output against. Matches
SubaruDefs/ECUFlash/subaru standard/Impreza WRX/AS80U.xml
byte-for-byte at the addresses sampled in
tests/private/test_va_wrx_rom_smoke.cpp.
"""

