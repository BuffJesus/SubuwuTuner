name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / MSVC
            os: windows-2022
            preset: win-msvc
            shell: pwsh

          - name: macOS / Apple Clang
            os: macos-14
            preset: mac-clang
            shell: bash

          - name: Linux / GCC
            os: ubuntu-24.04
            preset: linux-gcc
            shell: bash

          - name: Linux / Clang + ASan/UBSan
            os: ubuntu-24.04
            preset: linux-asan
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Ninja is preinstalled on GitHub-hosted runners (Windows/macOS/Linux).
      - name: Verify Ninja is available
        run: ninja --version

      - name: Set up MSVC (Windows only)
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Clang 18 (linux-asan)
        if: matrix.preset == 'linux-asan'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.preset }}/_deps
          key: ${{ matrix.preset }}-cmake-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: |
            ${{ matrix.preset }}-cmake-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Smoke-test CLI (Windows)
        if: matrix.os == 'windows-2022'
        run: |
          ./build/${{ matrix.preset }}/bin/subuwutuner-cli.exe --version
          ./build/${{ matrix.preset }}/bin/subuwutuner-cli.exe --help

      - name: Smoke-test CLI (Unix)
        if: matrix.os != 'windows-2022'
        run: |
          ./build/${{ matrix.preset }}/bin/subuwutuner-cli --version
          ./build/${{ matrix.preset }}/bin/subuwutuner-cli --help

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/CMakeFiles/CMakeOutput.log
            build/${{ matrix.preset }}/CMakeFiles/CMakeError.log
          retention-days: 7
          if-no-files-found: ignore

  defgen:
    name: defgen (Python tools)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run defgen unit tests
        run: python -m unittest discover -s tools/defgen -v

      - name: Smoke-test the synthetic fixture conversion
        run: |
          python tools/defgen/defgen.py tools/defgen/tests/fixtures/minimal_rom.xml -o /tmp/syn.toml
          # Re-parse with Python's tomllib to catch invalid TOML.
          python -c "import tomllib; tomllib.loads(open('/tmp/syn.toml').read())"

  formatting:
    name: clang-format (required)
    runs-on: ubuntu-24.04
    # Required gate: every src/**/*.{cpp,hpp} + tests/**/*.{cpp,hpp}
    # file must pass `clang-format --dry-run --Werror`. The codebase was
    # swept clean in the same commit that flipped this from advisory to
    # required. Contributors who don't have clang-format-18 locally can
    # `pip install --user clang-format==18.1.8` to match the CI binary.
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format

      - name: Check formatting
        run: |
          shopt -s globstar nullglob
          files=(src/**/*.cpp src/**/*.hpp tests/**/*.cpp tests/**/*.hpp)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No source files to check."
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"
