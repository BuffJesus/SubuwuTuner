name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / MSVC
            os: windows-2022
            preset: win-msvc
            shell: pwsh

          - name: macOS / Apple Clang
            os: macos-14
            preset: mac-clang
            shell: bash

          - name: Linux / GCC
            os: ubuntu-24.04
            preset: linux-gcc
            shell: bash

          - name: Linux / Clang + ASan/UBSan
            os: ubuntu-24.04
            preset: linux-asan
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Ninja is preinstalled on GitHub-hosted runners (Windows/macOS/Linux).
      - name: Verify Ninja is available
        run: ninja --version

      - name: Set up MSVC (Windows only)
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Clang 18 + GLFW X11 + GTK3 deps (linux-asan)
        if: matrix.preset == 'linux-asan'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 lld-18 llvm-18 \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev \
            libgtk-3-dev
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"

      - name: Install GLFW X11 + GTK3 deps (linux-gcc)
        if: matrix.preset == 'linux-gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev \
            libgtk-3-dev

      - name: Cache CMake build (v2 — busted on c2bfa03 to drop pre-fix _deps state)
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.preset }}/_deps
          key: ${{ matrix.preset }}-cmake-v2-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'src/ui/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ matrix.preset }}-cmake-v2-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Smoke-test CLI (Windows)
        if: matrix.os == 'windows-2022'
        run: |
          ./build/${{ matrix.preset }}/bin/subuwutuner-cli.exe --version
          ./build/${{ matrix.preset }}/bin/subuwutuner-cli.exe --help
          # Pack-validation smoke — see Unix variant above for details.
          ./build/${{ matrix.preset }}/bin/subuwutuner-cli.exe pack-info `
            --json fixtures/demo-pack/pack.toml | Out-Null

      - name: Smoke-test CLI (Unix)
        if: matrix.os != 'windows-2022'
        run: |
          ./build/${{ matrix.preset }}/bin/subuwutuner-cli --version
          ./build/${{ matrix.preset }}/bin/subuwutuner-cli --help
          # Pack-validation smoke: pack-info runs Definition::validate()
          # on load. Fails exit 1 on any validation error — guards the
          # demo pack against drift. The --json mode also exercises the
          # subuwutuner.pack-info.v1 JSON emitter so CI scripts that
          # depend on it stay green. (Per the 2026-06-01 analyst review
          # in fixtures/private/findings_reviews_2026-06-01/, this is
          # the QW-J "pack lint" smoke gate.)
          ./build/${{ matrix.preset }}/bin/subuwutuner-cli pack-info \
            --json fixtures/demo-pack/pack.toml > /dev/null

      - name: Performance gate — binary sizes (Unix)
        if: matrix.os != 'windows-2022'
        run: bash scripts/check-binary-sizes.sh build/${{ matrix.preset }}/bin

      - name: Performance gate — binary sizes (Windows)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: bash scripts/check-binary-sizes.sh build/${{ matrix.preset }}/bin

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/CMakeFiles/CMakeOutput.log
            build/${{ matrix.preset }}/CMakeFiles/CMakeError.log
          retention-days: 7
          if-no-files-found: ignore

  defgen:
    name: defgen (Python tools)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run defgen unit tests
        run: python -m unittest discover -s tools/defgen -v

      - name: Smoke-test the synthetic fixture conversion
        run: |
          python tools/defgen/defgen.py tools/defgen/tests/fixtures/minimal_rom.xml -o /tmp/syn.toml
          # Re-parse with Python's tomllib to catch invalid TOML.
          python -c "import tomllib; tomllib.loads(open('/tmp/syn.toml').read())"

  defgen-freeze:
    # PyInstaller single-file build of the `defgen` tool — closes
    # docs/04 pre-1.0 ship blocker #7. End users get a Python-free
    # binary to drop next to subuwutuner-cli in the installer. The
    # matrix runs all three OSes because PyInstaller fragments per
    # platform (each runner produces a binary that only works there);
    # the Release pipeline grabs the three artifacts and bundles each
    # into its platform-specific installer.
    name: defgen freeze (${{ matrix.os }})
    needs: defgen
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact_name: defgen-windows-x64
            exe: defgen.exe
          - os: macos-14
            artifact_name: defgen-macos-arm64
            exe: defgen
          - os: ubuntu-24.04
            artifact_name: defgen-linux-x64
            exe: defgen
    defaults:
      run:
        # Git Bash is preinstalled on the Windows runner, so a single
        # bash script keeps Win/macOS/Linux step bodies identical.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Freeze defgen
        working-directory: tools/defgen
        # --clean wipes the prior build cache (matters because Cache@v4
        # could otherwise stash a stale tree across runs).
        # --noconfirm skips the "overwrite dist/?" prompt — pyinstaller
        # exits non-zero on a TTY-less runner if the prompt would fire.
        run: pyinstaller defgen.spec --clean --noconfirm

      - name: Smoke-test the frozen binary
        # Mirror the source-mode smoke from the `defgen` job: convert
        # the synthetic RR XML through the frozen binary and re-parse
        # the resulting TOML with tomllib. Catches both "binary fails
        # to spawn" (wrong PyInstaller bundling, missing data/ dir) and
        # "binary outputs malformed TOML" (would mean the freeze
        # silently dropped a runtime-imported dep).
        run: |
          bin=tools/defgen/dist/${{ matrix.exe }}
          test -x "$bin" || { echo "frozen binary missing at $bin"; exit 1; }
          "$bin" tools/defgen/tests/fixtures/minimal_rom.xml -o syn.toml
          python -c "import tomllib; tomllib.loads(open('syn.toml').read())"

      - name: Upload frozen binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: tools/defgen/dist/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 14

  formatting:
    name: clang-format (required)
    runs-on: ubuntu-24.04
    # Required gate: every src/**/*.{cpp,hpp} + tests/**/*.{cpp,hpp}
    # file must pass `clang-format --dry-run --Werror`. The codebase was
    # swept clean in the same commit that flipped this from advisory to
    # required. Contributors who don't have clang-format-18 locally can
    # `pip install --user clang-format==18.1.8` to match the CI binary.
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format

      - name: Check formatting
        run: |
          shopt -s globstar nullglob
          files=(src/**/*.cpp src/**/*.hpp tests/**/*.cpp tests/**/*.hpp)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No source files to check."
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"

  mutation-flash:
    name: mutation testing (advisory) — st::flash
    # Advisory lane only: a surviving mutant in st::flash is a real
    # coverage gap, but it's the kind of thing we'd want to fix in a
    # follow-up rather than block the merge that surfaced it. Run on
    # push to main + manual dispatch only (skip per-PR to keep CI fast
    # and reviewer signal high). When the lane reports zero surviving
    # mutants for a quarter, flip continue-on-error off and make it a
    # ship gate; until then the value is the trend over time. Closes
    # the partial side of analyst Issue #19 (docs/33).
    if: github.event_name != 'pull_request'
    needs: build-test
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps + Python
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev \
            python3
          ninja --version
          python3 --version

      - name: Configure + build st_unit_tests
        run: |
          cmake -S . -B build --preset linux-gcc
          cmake --build build --target st_unit_tests -j

      - name: Mutation pass — Flasher::execute brick-safe ordering
        # 60-line window covering the brick-safe-ordering sector
        # reorder + delta-detect setup. As of 92d6d2b + 078911c the
        # range reports 100% on actionable mutants. The
        # quarter-clock for "flip continue-on-error off" starts on
        # this range.
        run: |
          python3 tools/mutation_test.py \
            --file src/flash/src/flash.cpp \
            --line-start 500 \
            --line-end 560 \
            --target st_unit_tests \
            --tag-filter "[flash]" \
            --max-mutants 20 \
            --build-timeout 180 \
            --test-timeout 180 \
            --build-dir build \
            --verbose \
            --mutations swap_eq,swap_lt,swap_gt || true

      - name: Mutation pass — Flasher::execute plan validation
        # 100-line window covering plan validation (data.size() vs
        # sector.length, sector.length > 0). Walks the validator
        # invariants that prevent malformed plans from reaching the
        # bus. 100% on the suite as of fdd858a.
        run: |
          python3 tools/mutation_test.py \
            --file src/flash/src/flash.cpp \
            --line-start 400 \
            --line-end 499 \
            --target st_unit_tests \
            --tag-filter "[flash]" \
            --max-mutants 20 \
            --build-timeout 180 \
            --test-timeout 180 \
            --build-dir build \
            --verbose \
            --mutations swap_eq,swap_lt,swap_gt || true

      - name: Mutation pass — BackupStore slugifier
        # 10-line window over the slug-character classifier surfaced
        # 3 actionable survivors (boundary chars Z/z/9) killed by
        # fdd858a. Tight window — small mutant count, fast cycle.
        run: |
          python3 tools/mutation_test.py \
            --file src/flash/src/backup_store.cpp \
            --line-start 30 \
            --line-end 40 \
            --target st_unit_tests \
            --tag-filter "[backup_store]" \
            --max-mutants 15 \
            --build-timeout 180 \
            --test-timeout 60 \
            --build-dir build \
            --verbose \
            --mutations swap_eq,swap_lt,swap_gt || true

      - name: Mutation pass — FlashPreflight battery thresholds
        # 25-line window over the battery-voltage validator
        # (block_below + warn_below thresholds). Boundary tests
        # in 488419d brought score to 100%.
        run: |
          python3 tools/mutation_test.py \
            --file src/policy/src/flash_preflight.cpp \
            --line-start 65 \
            --line-end 90 \
            --target st_unit_tests \
            --tag-filter "[policy]" \
            --max-mutants 10 \
            --build-timeout 180 \
            --test-timeout 60 \
            --build-dir build \
            --verbose \
            --mutations swap_eq,swap_lt,swap_gt || true
          # Exit 0 unconditionally — the lane is advisory; surviving
          # mutants surface in the job log + summary lines, not the
          # job's exit code (continue-on-error already caps blast
          # radius, this belt-and-braces is for the rare case where
          # the harness itself fails before printing a summary).
