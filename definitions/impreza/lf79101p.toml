# LF79101P pack — recognizes a third-party-installed-tune state and
# inherits the LF79103P table catalog (same firmware family, identical
# table addresses; the CID byte at offset 0x37C51 is the only diff).
#
# History: when a popular handheld flasher installs a tune, it
# overwrites the ROM CID descriptor at offset 0x37C51 from LF79102P
# (factory) to LF79101P (the flasher's "tuned car" marker). This pack
# lets `rom-identify` recognize that state and gives the editor the
# full table catalog via `extends`.
#
# Pairs with `lf79101p_cobb_f3xx_v2.toml` — that's the overlay carrying
# the COBB AP F3xx datalog PIDs. The chain at load time:
#     lf79101p_cobb_f3xx_v2  →  lf79101p  →  lf79103p
# Cobb-overlay PIDs land on top of LF79103P's tables.
#
# When the user uninstalls the third-party tune, the descriptor reverts
# to LF79102P and `lf79102p.toml` matches instead.

[pack]
schema_version = 1
id             = "lf79101p"
# Inherit table catalog from lf79103p (same firmware family; only the
# CID descriptor byte differs). Required for workflows like the FA24-
# swap recipe to pack_supports_*-gate correctly against this CID —
# the user's tuned ECU reports LF79101P at runtime even though the
# tables are at the LF79103P addresses.
extends        = "lf79103p"
display_name   = "LF79101P (third-party-installed-tune state)"
platform       = "subaru"
transmission   = "mt"
years          = [2017]
endianness     = "big"
rom_size_bytes = 2097152
license        = "Apache-2.0"
# COBB-installed ROMs carry a 25-slot per-block CRC-32 integrity table
# at 0x1FFF3C..0x1FFFA0 (analyst handoff 2026-06-06). Repair must fire
# after every cal edit or the bootloader integrity check trips.
# Restate explicitly so merge_over() doesn't lose the parent's
# subaru_std checksum when the LF79101P state needs the COBB-specific
# per-install scheme.
checksum_type  = "per_install_block_crc32"


[[identification]]
name      = "LF79101P"
cid_scan  = true
cid_match = "LF79101P"
ecu_part  = ""

# === DTC bitmap (resolved 2026-06-06 PM) ===
#
# Cross-verified across the LF79100P/101P/102P/103P family: all share the
# same bitmap base, structure, and per-code (byte, bit) positions. See
# D:/Subuwu/findings/decompile/lf79103p/DTC_BITMAP_RESOLVED.md for the
# derivation against the Stage-1 LF79100P decat tune (8/8 catalyst codes
# match perfectly).

[[dtc_bitmap]]
id           = "primary_dtc_enable"
name         = "Primary DTC enable bitmap"
# 1 bit per DTC, indexed by position in the DTC code table at 0x074400
# (stride 2 bytes per slot). 320 bytes covers 2560 possible DTC slots.
address      = 0x04CA68
length_bytes = 320
endianness   = "big"

# Catalyst efficiency — primary cat removal target for tuners.
[[dtc]]
code               = "P0420"
name               = "Catalyst System Efficiency Below Threshold Bank 1"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 26
bit                = 0
emissions_relevant = true

# Direct-injection HPFP fault — common after FA20DIT mods.
# Note: P008B not present in the standard DTC code table at 0x074400.
# Either stored under a different code form or in a separate (extended) table.
# Pack entry kept for documentation; flipping these bytes will NOT affect the
# real ECU behavior until P008B's actual location is found.
[[dtc]]
code               = "P008B"
name               = "Low Pressure Fuel System Pressure Too High (NOT IN STANDARD TABLE — needs further hunt)"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 0
bit                = 1
emissions_relevant = false

# Wastegate solenoid — surfaces during boost-by-gear tuning.
[[dtc]]
code               = "P0244"
name               = "Turbocharger Wastegate Solenoid A Range/Performance"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 36
bit                = 3
emissions_relevant = false

# Tumble Generator Valve — frequently disabled on intake mods.
[[dtc]]
code               = "P2610"
name               = "Tumble Generator Valve Performance"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 83
bit                = 2
emissions_relevant = true

# OBD-II readiness sentinel — disabling this hides incomplete monitors.
[[dtc]]
code               = "P0606"
name               = "ECM Processor Performance"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 95
bit                = 6
emissions_relevant = false

