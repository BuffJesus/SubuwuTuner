# Minimal LF79101P identifier pack — recognizes the user's car in
# COBB-installed state.
#
# Why: When COBB installs a tune, it overwrites the ROM CID descriptor
# at offset 0x37C51 from LF79102P (factory) to LF79101P (COBB's "tuned
# car" marker). This pack lets `rom-identify` recognize that state.
#
# Pairs with `lf79101p_cobb_f3xx.toml` — that's the overlay carrying
# the 12 R²-verified Cobb datalog PIDs. The byte positions in that
# overlay were R²-verified against the user's actual car sniff while
# in this very state.
#
# When the user uninstalls COBB, the descriptor reverts to LF79102P
# and `lf79102p.toml` matches instead.

[pack]
schema_version = 1
id             = "lf79101p"
display_name   = "LF79101P (COBB-installed state — stub identifier)"
platform       = "subaru"
transmission   = "mt"
years          = [2017]
endianness     = "big"
rom_size_bytes = 2097152
license        = "Apache-2.0"
# COBB-installed ROMs carry a 25-slot per-block CRC-32 integrity table
# at 0x1FFF3C..0x1FFFA0 (analyst handoff 2026-06-06). Repair must fire
# after every cal edit or the bootloader integrity check trips.
checksum_type  = "per_install_block_crc32"


[[identification]]
name      = "LF79101P"
cid_scan  = true
cid_match = "LF79101P"
ecu_part  = ""

# === DTC bitmap (resolved 2026-06-06 PM) ===
#
# Cross-verified across the LF79100P/101P/102P/103P family: all share the
# same bitmap base, structure, and per-code (byte, bit) positions. See
# D:/Subuwu/findings/decompile/lf79103p/DTC_BITMAP_RESOLVED.md for the
# derivation against the Stage-1 LF79100P decat tune (8/8 catalyst codes
# match perfectly).

[[dtc_bitmap]]
id           = "primary_dtc_enable"
name         = "Primary DTC enable bitmap"
# 1 bit per DTC, indexed by position in the DTC code table at 0x074400
# (stride 2 bytes per slot). 320 bytes covers 2560 possible DTC slots.
address      = 0x04CA68
length_bytes = 320
endianness   = "big"

# Catalyst efficiency — primary cat removal target for tuners.
[[dtc]]
code               = "P0420"
name               = "Catalyst System Efficiency Below Threshold Bank 1"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 26
bit                = 0
emissions_relevant = true

# Direct-injection HPFP fault — common after FA20DIT mods.
# Note: P008B not present in the standard DTC code table at 0x074400.
# Either stored under a different code form or in a separate (extended) table.
# Pack entry kept for documentation; flipping these bytes will NOT affect the
# real ECU behavior until P008B's actual location is found.
[[dtc]]
code               = "P008B"
name               = "Low Pressure Fuel System Pressure Too High (NOT IN STANDARD TABLE — needs further hunt)"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 0
bit                = 1
emissions_relevant = false

# Wastegate solenoid — surfaces during boost-by-gear tuning.
[[dtc]]
code               = "P0244"
name               = "Turbocharger Wastegate Solenoid A Range/Performance"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 36
bit                = 3
emissions_relevant = false

# Tumble Generator Valve — frequently disabled on intake mods.
[[dtc]]
code               = "P2610"
name               = "Tumble Generator Valve Performance"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 83
bit                = 2
emissions_relevant = true

# OBD-II readiness sentinel — disabling this hides incomplete monitors.
[[dtc]]
code               = "P0606"
name               = "ECM Processor Performance"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 95
bit                = 6
emissions_relevant = false

