# Minimal LF79102P identifier pack — recognizes the user's actual ROM CID.
#
# Why: SubuwuTuner has lf79100p.toml and lf79103p.toml in its definitions
# tree, but no lf79102p.toml. The user's actual car's ROM contains the
# LF79102P descriptor at offset 0x37C51 (verified — see
# `USER_CAR_CID_TRIANGULATION.md`). With no pack matching that string,
# `rom-identify` returns 0 matches against the user's ROMs.
#
# This stub pack contains ONLY the [pack] + [[identification]] blocks. It
# doesn't claim any calibration tables; just lets `rom-identify` find a
# match. Pairs with `lf79102p_cobb_f3xx.toml` (the overlay that extends
# this pack and adds the 12 R²-verified Cobb F3xx PIDs).
#
# If a full LF79102P RomRaider XML is sourced later, run defgen against
# it to produce a richer lf79102p.toml that replaces this stub.

[pack]
schema_version = 1
id             = "lf79102p"
display_name   = "LF79102P (stub identifier — no cal tables)"
platform       = "subaru"
transmission   = "mt"
years          = [2017]
endianness     = "big"
rom_size_bytes = 2097152
license        = "Apache-2.0"
# COBB-installed ROMs (including post-uninstall states that retain the
# table — uninstall is partial) carry a 25-slot per-block CRC-32
# integrity table at 0x1FFF3C..0x1FFFA0 (analyst handoff 2026-06-06).
# Pristine factory-virgin ROMs have FF-fill in the slot region; the
# repair will rewrite those 96 bytes to real CRCs (96/96 differ → 0/24
# slots match per the analyst's cross-ROM matrix) but the factory
# bootloader's integrity check doesn't gate on this table, so the
# rewrite is functionally inert. The field belongs here because the
# user's actual car sits in a COBB-touched LF79102P state where the
# table IS active.
checksum_type  = "per_install_block_crc32"


[[identification]]
name      = "LF79102P"
# FA-DIT WRX firmware embeds the CID in a descriptor at a variable
# per-firmware offset (~0x31C51 in bootloader-stripped dumps, ~0x37C51
# in full 2MB ROMs — 0x6000 difference is the bootloader). cid_scan
# lets the loader find it wherever it lives.
cid_scan  = true
cid_match = "LF79102P"
ecu_part  = ""

# === DTC bitmap (resolved 2026-06-06 PM) ===
#
# Cross-verified across the LF79100P/101P/102P/103P family: all share the
# same bitmap base, structure, and per-code (byte, bit) positions. See
# D:/Subuwu/findings/decompile/lf79103p/DTC_BITMAP_RESOLVED.md for the
# derivation against the Stage-1 LF79100P decat tune (8/8 catalyst codes
# match perfectly).

[[dtc_bitmap]]
id           = "primary_dtc_enable"
name         = "Primary DTC enable bitmap"
# 1 bit per DTC, indexed by position in the DTC code table at 0x074400
# (stride 2 bytes per slot). 320 bytes covers 2560 possible DTC slots.
address      = 0x04CA68
length_bytes = 320
endianness   = "big"

# Catalyst efficiency — primary cat removal target for tuners.
[[dtc]]
code               = "P0420"
name               = "Catalyst System Efficiency Below Threshold Bank 1"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 26
bit                = 0
emissions_relevant = true

# Direct-injection HPFP fault — common after FA20DIT mods.
# Note: P008B not present in the standard DTC code table at 0x074400.
# Either stored under a different code form or in a separate (extended) table.
# Pack entry kept for documentation; flipping these bytes will NOT affect the
# real ECU behavior until P008B's actual location is found.
[[dtc]]
code               = "P008B"
name               = "Low Pressure Fuel System Pressure Too High (NOT IN STANDARD TABLE — needs further hunt)"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 0
bit                = 1
emissions_relevant = false

# Wastegate solenoid — surfaces during boost-by-gear tuning.
[[dtc]]
code               = "P0244"
name               = "Turbocharger Wastegate Solenoid A Range/Performance"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 36
bit                = 3
emissions_relevant = false

# Tumble Generator Valve — frequently disabled on intake mods.
[[dtc]]
code               = "P2610"
name               = "Tumble Generator Valve Performance"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 83
bit                = 2
emissions_relevant = true

# OBD-II readiness sentinel — disabling this hides incomplete monitors.
[[dtc]]
code               = "P0606"
name               = "ECM Processor Performance"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 95
bit                = 6
emissions_relevant = false

