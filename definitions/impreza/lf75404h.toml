# Raw scalings for tables whose physical units aren't decoded yet —
# the editor shows the value 1:1 with the underlying integer.
# Hand-added 2026-06-09 for the HPFP phase transfer curve and its
# X-axis. See findings/decompile/lf79103p/HPFP_0x49BA0_RESOLVED.md.
[[scaling]]
id        = "raw_uint8"
formula   = "linear"
factor    = 1.0
offset    = 0.0
unit      = ""
precision = 0
data_type = "uint8"


[[scaling]]
id        = "raw_uint16_be"
formula   = "linear"
factor    = 1.0
offset    = 0.0
unit      = ""
precision = 0
data_type = "uint16_be"


# Generic 16-halfword uniform ramp 0x0000..0xF000 step 0x1000. Per
# analyst byte-pattern hunt (2026-06-09): this canonical address is
# referenced as a BE-word ~200 times per ROM — it's the firmware's
# generic "normalized 16-step index" axis. First consumer in this
# pack is fuel_timing_hpfp_phase_transfer_curve (below); future
# tables that need this axis can reference it by id without
# re-declaring. See findings/decompile/lf79103p/
# HPFP_TRANSFER_CURVE_SIBLING_PROMOTION.md §"X-axis pattern reuse".
[[axis]]
id        = "normalized_index_0_to_0xF000_step_0x1000"
name      = "Normalized 16-step Index (0..0xF000)"
unit      = ""
type      = "static"
address   = 0x0003834C
length    = 16
data_type = "uint16_be"
scaling   = "raw_uint16_be"


# 16-element 1-D HPFP phase transfer curve. Stock data pattern
# 4d4d4d4d4d4d3c3c372c2c2c21212121 (identical across the SH-2A
# A-series family). X-axis is the generic normalized 16-step index
# above. Per Ghidra disasm of FUN_001AF6D8 in LF79103P (the 1-D
# linear-interp dispatcher); cousin packs use the same descriptor
# format at per-CID addresses. Resolved 2026-06-09; see
# findings/decompile/lf79103p/HPFP_0x49BA0_RESOLVED.md
# (+ HPFP_TRANSFER_CURVE_SIBLING_PROMOTION.md for the per-CID
# address table). Hand-added 2026-06-09.
[[table]]
id                     = "fuel_timing_hpfp_phase_transfer_curve"
name                   = "HPFP Phase Transfer Curve"
category               = "fuel - timing - hpfp"
dimensions             = 1
address                = 0x0003F2F2
data_type              = "uint8"
scaling                = "raw_uint8"
axis_x                 = "normalized_index_0_to_0xF000_step_0x1000"
emissions_relevant     = false
engine_safety_critical = true


# Primary DTC enable bitmap. Added 2026-06-09 to support the
# tgv_egr_delete workflow's P0400 bit-clear step. Per-CID base
# address from analyst's byte-stem hunt (findings/handoffs/
# HANDOFF-from-analyst-2026-06-09-tgv-egr-sibling-addresses.md).
# Same 320-byte structure as LF79103P's bitmap.
[[dtc_bitmap]]
id           = "primary_dtc_enable"
name         = "Primary DTC enable bitmap"
address      = 0x00042184
length_bytes = 320
endianness   = "big"


# P0400 DTC entry — referenced by the tgv_egr_delete workflow's
# set_dtc_enabled call. byte_offset=0, bit=0 per analyst's note that
# "P0400 is record 0 of the DTC code table per the morning's mapping
# work, and that mapping is family-stable across all SH-2A siblings."
[[dtc]]
code               = "P0400"
name               = "Exhaust Gas Recirculation Flow Malfunction"
bitmap_id          = "primary_dtc_enable"
byte_offset        = 0
bit                = 0
emissions_relevant = true


# TGV + EGR delete workflow promoted from lf79103p.toml per analyst
# Tasks A-F (findings/tgv-egr-delete/). Off-road / track-only;
# jurisdiction-gated at modal entry. See lf79103p.toml header comment
# for the full delete-strategy rationale.
[[workflow]]
id              = "tgv_egr_delete"
display_name    = "TGV + EGR Delete (off-road only)"
modal           = "tgv_egr_delete"
required_tables = [
    "airflow_manifold_flow_model_egr_flow_model_egr_airflow",
    "airflow_manifold_flow_model_egr_flow_model_egr_absolute_pressure_main",
    "ignition_compensation_coolant_tgv_closed_activation",
    "ignition_compensation_egr_tgv_closed_ignition_timing_egr_adder_a",
    "ignition_compensation_egr_tgv_closed_ignition_timing_egr_adder_c",
]
